<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-transparent font-sans">

    <!-- THE CHAT WIDGET CONTAINER -->
    <div id="chat-widget-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col items-end">
        
        <!-- Chat Window -->
        <div id="customer-window" class="hidden w-[350px] h-[500px] bg-white rounded-2xl shadow-2xl flex-col overflow-hidden mb-4 border border-slate-200 animate-slide">
            <!-- Header -->
            <div class="bg-indigo-700 p-4 text-white flex justify-between items-center shadow-md">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="font-bold">Live Support</span>
                </div>
                <button onclick="toggleWidget()" class="opacity-70 hover:opacity-100 transition-opacity text-xl">&times;</button>
            </div>

            <!-- Messages Area -->
            <div id="customer-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 chat-scroll flex flex-col">
                <div class="text-center py-4">
                    <p class="text-xs text-slate-400 bg-slate-100 inline-block px-3 py-1 rounded-full">Typically replies in a few minutes</p>
                </div>
                <!-- Messages will load here -->
            </div>

            <!-- Input Area -->
            <form id="customer-form" class="p-4 border-t flex gap-2 bg-white">
                <input type="text" id="customer-input" placeholder="How can we help?" 
                       class="flex-1 bg-slate-100 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <button type="submit" class="bg-indigo-700 text-white p-2 rounded-xl hover:bg-indigo-800 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Toggle Button -->
        <button onclick="toggleWidget()" class="bg-indigo-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all group">
            <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 group-hover:rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC2Giy0opKrSSFNdZIIFWxqAJGF7DWx7Vg",
            authDomain: "chat2-3f634.firebaseapp.com",
            projectId: "chat2-3f634",
            storageBucket: "chat2-3f634.firebasestorage.app",
            messagingSenderId: "106973712960",
            appId: "1:106973712960:web:5d33cb4273c5e856cec5a5",
            measurementId: "G-05YR982059"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'my-custom-chat-app'; // Ensure this matches your Admin Panel ID

        let currentUser = null;
        let unsubCustomer = null;

        const customerMessages = document.getElementById('customer-messages');
        const customerForm = document.getElementById('customer-form');
        const customerInput = document.getElementById('customer-input');

        // Toggle UI
        window.toggleWidget = () => {
            const win = document.getElementById('customer-window');
            win.classList.toggle('hidden');
            win.classList.toggle('flex');
            if (win.classList.contains('flex')) {
                customerMessages.scrollTop = customerMessages.scrollHeight;
                customerInput.focus();
            }
        };

        // Auth & Session Logic
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log("Customer Session Active:", user.uid);
                initCustomerChat(user.uid);
            } else {
                try {
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("Auth failed:", error);
                }
            }
        });

        async function initCustomerChat(uid) {
            try {
                // Register session so Admin sees the user
                const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', uid);
                await setDoc(sRef, { 
                    userId: uid, 
                    lastActive: serverTimestamp(),
                    platform: window.location.hostname 
                }, { merge: true });

                // Listen for messages
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'chats', uid, 'messages');
                const q = query(ref, orderBy('timestamp', 'asc'));
                
                if (unsubCustomer) unsubCustomer();
                unsubCustomer = onSnapshot(q, (snap) => {
                    customerMessages.innerHTML = '';
                    snap.forEach(d => {
                        const data = d.data();
                        const isOwn = data.sender === uid;
                        const div = document.createElement('div');
                        div.className = `flex ${isOwn ? 'justify-end' : 'justify-start'} animate-slide`;
                        div.innerHTML = `
                            <div class="max-w-[85%] p-3 rounded-2xl shadow-sm text-sm ${
                                isOwn 
                                ? 'bg-indigo-600 text-white rounded-tr-none' 
                                : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'
                            }">
                                ${data.text}
                            </div>
                        `;
                        customerMessages.appendChild(div);
                    });
                    customerMessages.scrollTop = customerMessages.scrollHeight;
                });
            } catch (err) {
                console.error("Chat Init Error:", err);
            }
        }

        // Send Message
        customerForm.onsubmit = async (e) => {
            e.preventDefault();
            const val = customerInput.value.trim();
            if (!val || !currentUser) return;

            customerInput.value = '';
            try {
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'chats', currentUser.uid, 'messages');
                await addDoc(ref, { 
                    text: val, 
                    sender: currentUser.uid, 
                    timestamp: serverTimestamp() 
                });

                // Update session heartbeat
                const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', currentUser.uid);
                await setDoc(sRef, { lastActive: serverTimestamp() }, { merge: true });
            } catch (err) {
                console.error("Send Error:", err);
            }
        };
    </script>
</body>
</html>
