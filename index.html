<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Support Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 20px; }
        
        .message-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing-dot {
            width: 4px; height: 4px;
            background: #6366f1;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="bg-transparent overflow-hidden">

    <!-- THE CHAT WIDGET -->
    <div id="chat-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col items-end">
        
        <!-- Main Window -->
        <div id="chat-window" class="hidden w-[380px] h-[600px] max-h-[85vh] glass-panel rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] flex-col overflow-hidden mb-5 border border-white/50 animate-slide origin-bottom-right">
            
            <!-- Dynamic Header -->
            <div class="bg-indigo-600 p-6 text-white relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <h2 class="text-xl font-bold tracking-tight">Help Center</h2>
                        <div class="flex items-center gap-2 mt-1 opacity-90 text-xs">
                            <span class="relative flex h-2 w-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                            </span>
                            Support is online
                        </div>
                    </div>
                    <button onclick="window.toggleWidget()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div id="view-welcome" class="flex-1 flex flex-col p-6 overflow-y-auto chat-scroll">
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-semibold text-slate-800 mb-1">Welcome back! 👋</h3>
                        <p class="text-sm text-slate-500 leading-relaxed">How can our team help you today? Start a conversation below.</p>
                    </div>

                    <div class="space-y-3">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Quick Actions</p>
                        <button onclick="window.startChat('Order Status')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="package" class="w-5 h-5"></i></div>
                                <span class="text-sm font-medium text-slate-700">Track my order</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition-colors"></i>
                        </button>
                        <button onclick="window.startChat('Technical Issue')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-slate-50 border border-slate-100 rounded-2xl shadow-sm transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-orange-50 text-orange-600 rounded-lg"><i data-lucide="settings" class="w-5 h-5"></i></div>
                                <span class="text-sm font-medium text-slate-700">Technical support</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition-colors"></i>
                        </button>
                    </div>

                    <button onclick="window.showView('chat')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="message-square" class="w-5 h-5"></i>
                        Send us a message
                    </button>
                </div>
            </div>

            <div id="view-chat" class="hidden flex-1 flex flex-col min-h-0 bg-slate-50/50">
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll"></div>
                <div id="typing-indicator" class="hidden px-6 py-2">
                    <div class="flex gap-1 items-center bg-white w-12 py-2 px-3 rounded-full border border-slate-100 shadow-sm">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
                <div class="p-4 bg-white border-t border-slate-100">
                    <form id="chat-form" class="relative flex items-center gap-2">
                        <input type="text" id="chat-input" placeholder="Type a message..." 
                               class="w-full pl-4 pr-12 py-3 bg-slate-100 border-none rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                        <button type="submit" class="absolute right-1.5 p-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-md active:scale-90">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </form>
                    <p class="text-[10px] text-center text-slate-400 mt-2">Powered by Susara Creations</p>
                </div>
            </div>
        </div>

        <!-- Launcher Button -->
        <button id="launcher" onclick="window.toggleWidget()" class="group relative w-16 h-16 bg-indigo-600 text-white rounded-full shadow-[0_10px_30px_rgba(79,70,229,0.4)] flex items-center justify-center transition-all hover:scale-105 active:scale-95">
            <i data-lucide="message-circle" id="icon-closed" class="w-8 h-8 transition-all group-hover:rotate-6"></i>
            <i data-lucide="chevron-down" id="icon-opened" class="hidden w-8 h-8 transition-all"></i>
            <span class="absolute top-0 right-0 h-4 w-4 bg-rose-500 border-2 border-white rounded-full"></span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Giy0opKrSSFNdZIIFWxqAJGF7DWx7Vg",
            authDomain: "chat2-3f634.firebaseapp.com",
            projectId: "chat2-3f634",
            storageBucket: "chat2-3f634.firebasestorage.app",
            messagingSenderId: "106973712960",
            appId: "1:106973712960:web:5d33cb4273c5e856cec5a5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'premium-support-v1';

        let currentUser = null;
        let activeView = 'welcome';
        let unsub = null;
        
        const win = document.getElementById('chat-window');
        const viewWelcome = document.getElementById('view-welcome');
        const viewChat = document.getElementById('view-chat');
        const messagesContainer = document.getElementById('messages-container');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');

        lucide.createIcons();

        window.showView = (view) => {
            activeView = view;
            if(view === 'welcome') {
                viewWelcome.classList.remove('hidden');
                viewChat.classList.add('hidden');
            } else {
                viewWelcome.classList.add('hidden');
                viewChat.classList.remove('hidden');
                setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 100);
            }
        };

        window.toggleWidget = () => {
            const isHidden = win.classList.contains('hidden');
            win.classList.toggle('hidden');
            win.classList.toggle('flex');
            document.getElementById('icon-closed').classList.toggle('hidden', isHidden);
            document.getElementById('icon-opened').classList.toggle('hidden', !isHidden);
            
            if (!isHidden && activeView === 'chat') {
                chatInput.focus();
            }
        };

        window.startChat = (subject) => {
            window.showView('chat');
            if (subject) {
                sendMessage(`I have a question about: ${subject}`);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                initSession(user.uid);
            } else {
                try {
                    await signInAnonymously(auth);
                } catch (e) { console.error(e); }
            }
        });

        async function initSession(uid) {
            const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', uid);
            await setDoc(sRef, { 
                uid, 
                lastSeen: serverTimestamp(), 
                status: 'online',
                origin: window.location.hostname 
            }, { merge: true });

            const q = query(
                collection(db, 'artifacts', appId, 'public', 'data', 'chats', uid, 'messages'),
                orderBy('timestamp', 'asc')
            );

            if (unsub) unsub();
            unsub = onSnapshot(q, (snap) => {
                messagesContainer.innerHTML = '';
                snap.forEach(d => renderMessage(d.data()));

                if (snap.size > 0 && activeView === 'welcome') {
                    window.showView('chat');
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, (err) => console.error(err));
        }

        function renderMessage(data) {
            const isMe = data.sender === currentUser?.uid;
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} message-in`;
            
            div.innerHTML = `
                <div class="max-w-[80%]">
                    <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm ${
                        isMe 
                        ? 'bg-indigo-600 text-white rounded-tr-none' 
                        : 'bg-white text-slate-700 border border-slate-100 rounded-tl-none'
                    }">
                        ${data.text}
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1 ${isMe ? 'text-right' : 'text-left'}">
                        ${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now'}
                    </p>
                </div>
            `;
            messagesContainer.appendChild(div);
        }

        async function sendMessage(text) {
            if (!text.trim() || !currentUser) return;
            const msgRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats', currentUser.uid, 'messages');
            await addDoc(msgRef, { text, sender: currentUser.uid, timestamp: serverTimestamp() });
            const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'sessions', currentUser.uid);
            await setDoc(sRef, { lastSeen: serverTimestamp() }, { merge: true });
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const val = chatInput.value;
            chatInput.value = '';
            sendMessage(val);
        };
    </script>
</body>
</html>
